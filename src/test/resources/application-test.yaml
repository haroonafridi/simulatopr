etoro:
  api-key: myApiKey
  user-key: myUserKey
  limit-order-url: https://public-api.etoro.com/api/v1/trading/execution/demo/limit-orders
  market-order-url: http://localhost:8080/etoro/saveOrder
  instrument-candle-data-url: https://public-api.etoro.com/api/v1/market-data/instruments/
  order-information-url: https://public-api.etoro.com/api/v1/trading/info/demo/orders/
  portfolio-information-url: http://localhost:8080/etoro/portfolio
  url: ws://localhost:8025/ws/etoro

  spring:
    datasource:
      url: jdbc:mysql://localhost:3306/strategy-unit-test
      username: root
      password: root
      driver-class-name: com.mysql.cj.jdbc.Driver
    jpa:
      hibernate:
        ddl-auto: update
      show-sql: true
    server:
      port: 8086